name: Guardar métricas de los reels

on:
  # Lo lanza cron-job.org 5 veces al día (0:30, 8:30, 14:30, 18:30 y 22:30 en Madrid), fuera de la
  # franja de publicación (9:00-12:45) para no hacer cola con el publicador.
  # El cron de GitHub queda como respaldo diario: GitHub lo retrasa varias horas.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: publicar      # comparte turno con el publicador para no chocar al hacer push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay reels publicados?
        id: hay
        run: |
          if ls publicado/*.json >/dev/null 2>&1; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "Nada publicado todavía"; fi
      - uses: actions/setup-python@v5
        if: steps.hay.outputs.si == '1'
        with:
          python-version: "3.12"
      - name: Leer métricas
        if: steps.hay.outputs.si == '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publicador/metricas.py
      - name: Leer estadísticas de la cuenta
        if: steps.hay.outputs.si == '1'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publicador/cuenta.py
      - name: Guardar
        if: steps.hay.outputs.si == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A metricas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Métricas $(TZ=Europe/Madrid date +'%d/%m %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
